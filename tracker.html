<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker — EnviroTracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand-row">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 21c0-5 3-9 8-11-1 6-3 9-8 11z" fill="currentColor" opacity="0.85"/>
        <path d="M12 21c0-6-3-10-8-12 1 7 3 10 8 12z" fill="currentColor" opacity="0.6"/>
        <line x1="12" y1="21" x2="12" y2="9" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <div>
        
        <h1>EnviroTracker</h1>
      </div>
    </div>
    <nav class="navbar">
      <ul class="navmenu">
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="tracker.html" class="nav-link current">Habit Tracker</a></li>
        <li class="nav-item"><a href="tips.html" class="nav-link">Tips &amp; Tricks</a></li>
        <li class="nav-item"><a href="about.html" class="nav-link">About Us</a></li>
        <li class="nav-item"><a href="company.html" class="nav-link">Corporate Impacts</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <p class="lede">Click on a date and log your habits for that day. All of your data will be saved in your browser.  
      </p>

    <div class="sprout-panel" style="margin-bottom:1.75rem;">
      <div data-sprout></div>
      <p class="streak-count" data-streak-current>0</p>
      <p class="streak-label">Day streak</p>
      <div class="stat-row">
        <div class="stat">
          <div class="num" data-streak-longest>0</div>
          <div class="lbl">Best streak</div>
        </div>
        <div class="stat">
          <div class="num" data-streak-total>0</div>
          <div class="lbl">Habits logged</div>
        </div>
      </div>
    </div>

    <div class="tracker-grid">
      <div class="card" data-calendar>
        <div class="cal-head">
          <button type="button" class="cal-nav-btn" data-cal-prev aria-label="Previous month">‹</button>
          <span class="month-label" data-month-label></span>
          <button type="button" class="cal-nav-btn" data-cal-next aria-label="Next month">›</button>
        </div>
        <div class="cal-weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="cal-grid" data-cal-grid></div>
      </div>

      <div class="card day-panel">
        <h3>Today's log</h3>
        <p class="day-sub" id="day-sub"></p>
        <ul class="habit-list" id="habit-list"></ul>

        <form id="add-habit-form" class="add-habit-row">
          <label for="new-habit-input" class="sr-only" style="position:absolute;left:-9999px;">Add a new habit</label>
          <input type="text" id="new-habit-input" placeholder="Add a habit, e.g. Line-dried laundry" />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
      </div>
    </div>
  </main>



  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
